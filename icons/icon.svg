<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="beltWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" /><stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="beltBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" /><stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="beltPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" /><stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <linearGradient id="beltBrown" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309" /><stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="beltBlack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#374151" /><stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners for app icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="115" fill="none" stroke="#334155" stroke-width="6" />

  <!-- Octagon Grappler Frame -->
  <polygon points="256,54 430,126 430,336 256,448 82,336 82,126" fill="#1E293B" opacity="0.7" stroke="#475569" stroke-width="6" stroke-linejoin="round" />

  <!-- The 5 Ranked Belts at bottom -->
  <g transform="translate(116, 360)">
    <rect x="0" y="0" width="50" height="14" rx="4" fill="url(#beltWhite)" />
    <rect x="58" y="0" width="50" height="14" rx="4" fill="url(#beltBlue)" />
    <rect x="116" y="0" width="50" height="14" rx="4" fill="url(#beltPurple)" />
    <rect x="174" y="0" width="50" height="14" rx="4" fill="url(#beltBrown)" />
    <rect x="232" y="0" width="50" height="14" rx="4" fill="url(#beltBlack)" stroke="#EF4444" stroke-width="2" />
  </g>

  <!-- Submission Silhouette / Tap Flash -->
  <g transform="translate(256, 215)">
    <circle cx="0" cy="-10" r="85" fill="#EF4444" opacity="0.25" filter="url(#glow)" />
    
    <!-- Submission Lightning Bolt -->
    <polygon points="-10,-85 14,-85 -4,-40 20,-40 -26,25 -12,-25 -28,-25" fill="#FACC15" filter="url(#glow)" />

    <text x="0" y="90" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" letter-spacing="4">SUB·LOG</text>
    <text x="0" y="118" text-anchor="middle" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" letter-spacing="6">NO-GI TRACKER</text>
  </g>
</svg>
